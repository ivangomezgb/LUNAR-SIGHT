# Curated lunar south pole sites. lat/lon planetocentric degrees, longitude east-positive
# (-180..180). Every coordinate has a citable source; uncertainties are in source_note.
sites:
  - id: shackleton-rim
    name: Shackleton Rim (Point A)
    lat_deg: -89.6644
    lon_deg: -165.7935
    ref_lat_deg: -89.68
    ref_lon_deg: -166.0
    selection: best-lit point with slope <= 8 deg within 1 km of the reference (474 m away; 36.63% -> 56.55% sunlight in 2027 at 2 m)
    group: science
    tags: [illumination, shackleton, rim]
    source_url: https://doi.org/10.1016/j.icarus.2010.03.028
    source_note: >-
      "Point A" on the rim of Shackleton crater, 89.68 S 166.0 W, from Bussey et al. (2010),
      Icarus 208, 558-564, illumination of the south pole from Kaguya topography.

  - id: mons-mouton
    name: Mons Mouton (IM-2 Athena site)
    lat_deg: -84.7906
    lon_deg: 29.1957
    group: clps
    tags: [clps, im-2, mons-mouton, viper, artemis-iii-2024]
    source_url: https://lroc.im-ldi.com/images/1408
    source_note: >-
      Resting position of Intuitive Machines' IM-2 Athena lander (landed 2025-03-06), located
      by LROC at 84.7906 S 29.1957 E inside a ~20 m crater. Mons Mouton is also the
      VIPER target area and a NASA Artemis III candidate region (2024 list); this point is
      the Athena site, not the summit of the massif.

