<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hour-by-hour sunlight and Earth visibility for lunar south pole landing sites, from LOLA terrain and SPICE ephemeris." />
    <meta name="theme-color" content="#07090d" />
    <meta property="og:title" content="Lunar Landing Site Navigator" />
    <meta property="og:image" content="./media/south-polar-hillshade.jpg" />
    <meta property="og:image:alt" content="NASA LOLA south polar hillshade, a static terrain context image" />
    <meta property="og:description" content="Explore real lunar terrain in 3D and 360°. Compare sunlight and Earth visibility using NASA LOLA terrain and JPL ephemerides." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>Lunar Landing Site Navigator</title>
    <script>
      // After a deploy, a cached copy of this page can point at build files that no longer exist
      // (blank page), and an open tab can fail to load a lazy screen. Reload once to get the new
      // build; the time stamp stops a loop when the network is really down.
      (function () {
        function recover() {
          try {
            var last = Number(sessionStorage.getItem('lls-reload') || 0);
            if (Date.now() - last < 20000) return;
            sessionStorage.setItem('lls-reload', String(Date.now()));
          } catch (e) { /* storage blocked: still try once */ }
          location.reload();
        }
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK') && /\/assets\//.test(el.src || el.href || '')) recover();
        }, true);
        window.addEventListener('vite:preloadError', function (e) { e.preventDefault(); recover(); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
